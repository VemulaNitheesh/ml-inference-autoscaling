apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locust-runner:milestone1
          imagePullPolicy: Never
          ports:
            - containerPort: 8089
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
