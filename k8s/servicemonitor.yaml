apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: ml-inference-monitor
  namespace: default

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: ml-inference

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scheme: http

